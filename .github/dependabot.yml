# Dependabot opens a PR when a pinned dependency has a newer version.
# The Python code uses only the standard library and the UI has no JS libraries,
# so what it can track is the build container and the GitHub-owned actions the
# workflows pin by commit SHA. bb-imager (a pinned release built by
# tools/setup_bb_imager.sh) and the scanners pinned in .github/scripts/fetch-tool.sh
# are outside its reach: those are updated by hand (see AGENTS.md "CI and scanning").
#
# cooldown: a new release is proposed only once it is that many days old, so a
# compromised release has time to be caught and pulled before it reaches this
# repository. 14 days for actions; 3 for Debian's official image, whose new digests
# are mostly security fixes that should not wait two weeks.
version: 2
updates:
  - package-ecosystem: docker
    directory: /tools/builder
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "Builder image"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "CI"
