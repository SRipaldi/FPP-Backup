# Coverage-guided fuzzing (Atheris / libFuzzer) of the code that parses input this tool doesn't
# control: controller logs, release notes, settings that become a shell script, sequence headers,
# the fleet policy, and the leak check's regexes. Targets are in fuzz/fuzz.py.
#
# A minute per target on a pull request that touches tools/ or fuzz/; ten minutes each weekly.
# A crash, an uncaught exception or a hang fails the job and keeps the input as an artifact.
#
# Trust model (see AGENTS.md "CI and scanning"): GitHub-owned actions pinned by commit SHA; Atheris
# pinned by version and hash (fuzz/requirements.txt, pip --require-hashes); read-only token, no secrets.
name: Fuzz

on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays 06:41 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - tools/**
      - fuzz/**
      - .github/workflows/fuzz.yml

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [syslog, release-notes, rootfs, fseq, policy, leak-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Atheris (pinned, hash verified)
        run: python3 -m pip install --quiet --no-deps --only-binary=":all:" --require-hashes -r fuzz/requirements.txt
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ github.event_name == 'pull_request' && '60' || '600' }}
        run: |
          mkdir -p crashes "corpus-$TARGET"
          python3 fuzz/fuzz.py "$TARGET" -max_total_time="$SECONDS_EACH" -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=crashes/ "corpus-$TARGET" "fuzz/corpus/$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: crashes/
          retention-days: 30
