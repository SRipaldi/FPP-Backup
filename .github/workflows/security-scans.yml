# Dependency (SCA) and repository-posture scans. OSV-Scanner results go to Security > Code scanning;
# Scorecard's go to the run's summary page (and a 90-day artifact).
#
#   builder image   the card-builder container exactly as build_image.sh builds it (tools/builder/
#                   Dockerfile: pinned Alpine base + its packages), for known vulnerabilities (OSV-Scanner)
#   scorecard       OpenSSF Scorecard: branch protection, pinning, signing, token permissions...
#
# Weekly (vulnerabilities are published over time, not only when this repo changes), on a pull request
# that touches what is scanned, and by hand.
#
# Trust model (see AGENTS.md "CI and scanning"): no third-party actions; GitHub-owned actions pinned by
# commit SHA; scanners pinned by version and SHA-256 (.github/scripts/fetch-tool.sh). The jobs that run a
# scanner get a read-only token and no secrets; only the last job, which runs nothing but GitHub's own
# upload action, may write security results.
name: Security scans

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - tools/builder/Dockerfile
      - tools/build_image.sh
      - .github/scripts/**
      - .github/workflows/security-scans.yml
  push:
    branches: [main]
    paths:
      - tools/builder/Dockerfile
      - tools/build_image.sh
      - .github/scripts/**
      - .github/workflows/security-scans.yml

permissions: {}

jobs:
  builder-image:
    name: OSV-Scanner (builder image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner (pinned, SHA-256 verified)
        run: .github/scripts/fetch-tool.sh osv-scanner
      - name: Assemble the builder image as it runs
        run: .github/scripts/builder-runtime-image.sh "$RUNNER_TEMP/builder.tar"
      - name: Scan
        run: |
          # Exit 1 means vulnerabilities were found: they are reported through code scanning, not as a failed job.
          rc=0
          osv-scanner scan image --archive "$RUNNER_TEMP/builder.tar" --format sarif --output osv-builder-image.sarif || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::osv-scanner failed ($rc)"; exit "$rc"; }
          osv-scanner scan image --archive "$RUNNER_TEMP/builder.tar" --format table || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sarif-osv-builder-image
          path: osv-builder-image.sarif
          retention-days: 7


  scorecard:
    name: OpenSSF Scorecard
    # Scores the repository's settings on main; meaningless on a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Scorecard (pinned, SHA-256 verified)
        run: .github/scripts/fetch-tool.sh scorecard
      - name: Score
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}   # read-only (see permissions above)
        # The Scorecard program has no SARIF output (only its GitHub Action does, and third-party actions are
        # not used here), so the results are a table on the run's summary page plus the JSON as an artifact.
        run: |
          scorecard --repo="github.com/${GITHUB_REPOSITORY}" --format=json --show-details > scorecard.json
          python3 - scorecard.json >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"## OpenSSF Scorecard: {r['score']} / 10\n")
          print("| Check | Score | Reason |\n|---|---|---|")
          for c in sorted(r["checks"], key=lambda c: (c["score"] if c["score"] >= 0 else 99, c["name"])):
              score = "n/a" if c["score"] < 0 else c["score"]
              print(f"| {c['name']} | {score} | {c['reason'].replace('|', '/')} |")
          EOF
          cat "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard
          path: scorecard.json
          retention-days: 90

  publish:
    name: Publish results to code scanning
    needs: [builder-image]
    # Not for forks: no write token there.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
      - name: Upload builder image results
        if: hashFiles('sarif/sarif-osv-builder-image/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4.39.2
        with:
          sarif_file: sarif/sarif-osv-builder-image/osv-builder-image.sarif
          category: osv-builder-image
